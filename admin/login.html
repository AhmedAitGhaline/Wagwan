<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WAGWAN — Admin Login</title><link rel="stylesheet" href="../styles.css">
<style>
body{min-height:100vh;background:#f5f6f6;display:grid;place-items:center}.login-card{width:min(430px,calc(100% - 32px));background:#fff;border:1px solid #e5e7e7;padding:42px;box-shadow:0 20px 60px #00000012}.login-logo{text-align:center;margin-bottom:30px}.login-logo img{width:180px;height:auto}.login-card h1{text-align:center;font-size:26px;margin:0 0 8px}.login-card p{text-align:center;color:#777;font-size:13px;margin:0 0 28px}.login-card label{display:block;font-size:12px;font-weight:700;margin:14px 0}.login-card input{width:100%;padding:14px;border:1px solid #ddd;background:#fff;margin-top:7px;box-sizing:border-box}.login-card button{width:100%;margin-top:12px}.login-error{color:#c82020;font-size:12px;min-height:18px;text-align:center;margin-top:12px}.back{display:block;text-align:center;margin-top:20px;color:#555;font-size:12px}
</style>
</head>
<body>
<main class="login-card">
<div class="login-logo"><img src="../assets/wagwan-logo.png" alt="WAGWAN"></div>
<h1>ADMIN PANEL</h1><p>Sign in with your authorized WAGWAN admin account.</p>
<form id="admin-login-form"><label>Email<input type="email" id="login-email" required autocomplete="username"></label><label>Password<input type="password" id="login-password" required autocomplete="current-password"></label><button class="btn black" type="submit">LOGIN</button><div id="login-error" class="login-error"></div></form>
<a class="back" href="../index.html">← Back to store</a>
</main>
<script src="../supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-runtime.js"></script>
<script>
(async()=>{
 const err=document.getElementById('login-error');
 if(!window.wagwanSB){err.textContent='Supabase is not configured. Edit supabase-config.js.';return;}
 const {data:{session}}=await wagwanSB.auth.getSession(); if(session) location.href='index.html';
 document.getElementById('admin-login-form').addEventListener('submit',async e=>{
  e.preventDefault();err.textContent='';
  const email=document.getElementById('login-email').value.trim(),password=document.getElementById('login-password').value;
  const {error}=await wagwanSB.auth.signInWithPassword({email,password});
  if(error){err.textContent='Invalid credentials or unauthorized account.';return;}
  const {data:profile}=await wagwanSB.from('profiles').select('role').eq('id',(await wagwanSB.auth.getUser()).data.user.id).single();
  if(profile?.role!=='admin'){await wagwanSB.auth.signOut();err.textContent='This account is not an authorized admin.';return;}
  location.href='index.html';
 });
})();
</script>
</body></html>
